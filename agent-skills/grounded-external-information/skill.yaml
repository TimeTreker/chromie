title: Grounded External Information
description: Select only for provider-neutral Goals that require facts from an actually accessible outside information source, including weather, places, restaurants, web research, news, and how-to retrieval. Do not select for deterministic trusted local reads such as Chromie's local clock, direct visual or auditory observation of Chromie's immediate environment, or merely because a Goal needs fresh runtime evidence. Preserve exact bindings, evidence freshness, typed failure interpretation, and grounded delivery when an outside source is actually required.
