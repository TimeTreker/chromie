                  await ws.send(json.dumps({"type": "health"}))
                  message = await asyncio.wait_for(ws.recv(), timeout=5)
                  payload = json.loads(message)
                  assert payload.get("type") == "pong"
                  assert payload.get("provider", {}).get("provider_id") == "oute"

          asyncio.run(main())
          PY
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  chromie-tts-qwen3:
    profiles: ["tts-evaluation"]
    container_name: chromie-tts-qwen3
    build:
      context: .
      dockerfile: tts_candidates/qwen3/Dockerfile
