services:
  chromie-asr:
    container_name: chromie-asr
    build:
      context: ./asr
      args:
        ASR_CUDA_IMAGE: ${ASR_CUDA_IMAGE}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,host.docker.internal}
        no_proxy: ${NO_PROXY:-localhost,127.0.0.1,host.docker.internal}
    image: chromie-asr:${CHROMIE_IMAGE_TAG:?CHROMIE_IMAGE_TAG must be set}
    init: true
    restart: unless-stopped
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "127.0.0.1:9001:9001"
    environment:
      CHROMIE_ACTIVE_PROFILE: ${CHROMIE_ACTIVE_PROFILE:?CHROMIE_ACTIVE_PROFILE must be generated}
      CHROMIE_RUNTIME_ENV_FINGERPRINT: ${CHROMIE_RUNTIME_ENV_FINGERPRINT:?CHROMIE_RUNTIME_ENV_FINGERPRINT must be generated}
      TZ: ${CHROMIE_HOST_TIMEZONE:?CHROMIE_HOST_TIMEZONE must be detected}
      ASR_HOST: "0.0.0.0"
      ASR_PORT: "9001"
      ASR_MODE: ${ASR_MODE:-final}
      ASR_MODEL: ${ASR_MODEL}
      ASR_MODEL_REVISION: ${ASR_MODEL_REVISION}
      ASR_DEVICE: ${ASR_DEVICE}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-}
      ASR_SAMPLE_RATE: ${ASR_SAMPLE_RATE:-16000}
      ASR_MAX_CONCURRENT_TRANSCRIPTIONS: ${ASR_MAX_CONCURRENT_TRANSCRIPTIONS:-1}
      ASR_STARTUP_WARMUP_ENABLED: ${ASR_STARTUP_WARMUP_ENABLED:-true}
      ASR_STARTUP_WARMUP_AUDIO_SECONDS: ${ASR_STARTUP_WARMUP_AUDIO_SECONDS:-1.0}

      SHERPA_ONNX_MODEL_TYPE: ${SHERPA_ONNX_MODEL_TYPE:-sense_voice}
      SHERPA_ONNX_PROVIDER: ${SHERPA_ONNX_PROVIDER:-cuda}
      SHERPA_ONNX_NUM_THREADS: ${SHERPA_ONNX_NUM_THREADS:-2}
      SHERPA_ONNX_LANGUAGE: ${SHERPA_ONNX_LANGUAGE:-auto}
      SHERPA_ONNX_USE_ITN: ${SHERPA_ONNX_USE_ITN:-true}
      SHERPA_ONNX_DEBUG: ${SHERPA_ONNX_DEBUG:-false}
      SHERPA_ONNX_MODEL_FILE: ${SHERPA_ONNX_MODEL_FILE:-}
      SHERPA_ONNX_TOKENS_FILE: ${SHERPA_ONNX_TOKENS_FILE:-}

      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}

      HF_HOME: /root/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /root/.cache/huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-0}
      HF_HUB_DISABLE_TELEMETRY: "1"

      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,host.docker.internal,chromie-asr,chromie-tts,chromie-llm,chromie-agent}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,host.docker.internal,chromie-asr,chromie-tts,chromie-llm,chromie-agent}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./hf_cache:/root/.cache/huggingface
    networks:
      - chromie-net
    healthcheck:
      test:
        - CMD-SHELL
        - |
          python - <<'PY'
          import asyncio, json, websockets

          async def main():
              async with websockets.connect("ws://127.0.0.1:9001", open_timeout=5) as ws:
                  await ws.send(json.dumps({"type": "health"}))
                  msg = await asyncio.wait_for(ws.recv(), timeout=5)
                  assert json.loads(msg).get("type") == "pong"

          asyncio.run(main())
          PY
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  chromie-tts:
    container_name: chromie-tts
    build:
      context: .
      dockerfile: tts_candidates/cosyvoice/Dockerfile
      args:
        CUDA_IMAGE: ${TTS_CANDIDATE_CUDA_IMAGE:-nvidia/cuda:12.8.1-cudnn-runtime-ubuntu22.04}
        COSYVOICE3_SOURCE_REVISION: ${COSYVOICE3_SOURCE_REVISION:-074ca6dc9e80a2f424f1f74b48bdd7d3fea531cc}
        TTS_CUDA_ARCH: ${TTS_CUDA_ARCH}
        CHROMIE_BUILD_PROFILE: ${CHROMIE_ACTIVE_PROFILE:?CHROMIE_ACTIVE_PROFILE must be generated}
        PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cu128}
    image: chromie-tts:${CHROMIE_IMAGE_TAG:?CHROMIE_IMAGE_TAG must be set}
    init: true
    restart: unless-stopped
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      CHROMIE_ACTIVE_PROFILE: ${CHROMIE_ACTIVE_PROFILE:?CHROMIE_ACTIVE_PROFILE must be generated}
      CHROMIE_RUNTIME_ENV_FINGERPRINT: ${CHROMIE_RUNTIME_ENV_FINGERPRINT:?CHROMIE_RUNTIME_ENV_FINGERPRINT must be generated}
      TZ: ${CHROMIE_HOST_TIMEZONE:?CHROMIE_HOST_TIMEZONE must be detected}
      TTS_CUDA_ARCH: ${TTS_CUDA_ARCH:?TTS_CUDA_ARCH must come from the detected profile}
      TTS_HOST: "0.0.0.0"
      TTS_PORT: "5000"
      TTS_PROVIDER: ${TTS_PROVIDER:-fun-cosyvoice3-0.5b}
      TTS_VOICE_ROOT: /voices
      TTS_DEFAULT_SPEAKER: ${TTS_DEFAULT_SPEAKER:-chromie_mixed}
      TTS_WORKER_STARTUP_TIMEOUT_SEC: ${TTS_WORKER_STARTUP_TIMEOUT_SEC:-1200}
      TTS_CANDIDATE_CANCEL_DRAIN_TIMEOUT_SEC: ${TTS_CANDIDATE_CANCEL_DRAIN_TIMEOUT_SEC:-3}
      TTS_CANDIDATE_COLD_FIRST_AUDIO_TIMEOUT_SEC: ${TTS_CANDIDATE_COLD_FIRST_AUDIO_TIMEOUT_SEC:-180}
      TTS_CANDIDATE_COLD_REQUEST_TIMEOUT_SEC: ${TTS_CANDIDATE_COLD_REQUEST_TIMEOUT_SEC:-240}
      TTS_CANDIDATE_FIRST_AUDIO_TIMEOUT_SEC: ${TTS_CANDIDATE_FIRST_AUDIO_TIMEOUT_SEC:-20}
      TTS_CANDIDATE_REQUEST_TIMEOUT_SEC: ${TTS_CANDIDATE_REQUEST_TIMEOUT_SEC:-60}
      PYTORCH_ALLOC_CONF: ${TTS_PYTORCH_ALLOC_CONF:-expandable_segments:True}
      COSYVOICE3_SOURCE_REVISION: ${COSYVOICE3_SOURCE_REVISION:-074ca6dc9e80a2f424f1f74b48bdd7d3fea531cc}
      COSYVOICE3_MODEL_ID: ${COSYVOICE3_MODEL_ID:-FunAudioLLM/Fun-CosyVoice3-0.5B-2512}
      COSYVOICE3_MODEL_REVISION: ${COSYVOICE3_MODEL_REVISION:-29e01c4e8d000f4bcd70751be16fa94bf3d85a18}
      COSYVOICE3_FP16: ${COSYVOICE3_FP16:-1}
      COSYVOICE3_PROMPT_PREFIX: ${COSYVOICE3_PROMPT_PREFIX:-You are a helpful assistant.}
      HF_HOME: /root/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /root/.cache/huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-0}
      HF_HUB_DISABLE_TELEMETRY: "1"
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      TOKENIZERS_PARALLELISM: "false"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,host.docker.internal,chromie-asr,chromie-tts,chromie-llm,chromie-agent}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,host.docker.internal,chromie-asr,chromie-tts,chromie-llm,chromie-agent}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./hf_cache:/root/.cache/huggingface
      - ./hf_cache/modelscope:/root/.cache/modelscope
      - type: bind
        source: ${TTS_VOICE_ROOT:-./assets/tts/voices}
        target: /voices
        read_only: true
    networks:
      - chromie-net
    healthcheck:
      test:
        - CMD-SHELL
        - |
          python - <<'PY'
          import asyncio, json, websockets

          async def main():
              async with websockets.connect("ws://127.0.0.1:5000", open_timeout=5) as ws:
                  await ws.send(json.dumps({"type": "health"}))
                  message = await asyncio.wait_for(ws.recv(), timeout=5)
                  payload = json.loads(message)
                  assert payload.get("type") == "pong"
                  assert payload.get("provider", {}).get("provider_id") == "fun-cosyvoice3-0.5b"

          asyncio.run(main())
          PY
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1200s

