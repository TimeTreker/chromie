<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">Chromie Cognitive and Capability Flow — Detailed Reference</title>
  <desc id="desc">A light, event-driven architecture diagram showing Goal Interpretation, Planner and Goal Association, the Trusted Capability Runtime, Providers, runtime events, trusted Evidence, bounded state, CognitiveOpportunity, Planner re-entry, and deterministic Protective Reflex.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/></marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 42px; font-weight: 750; letter-spacing: -0.8px; }
      .subtitle { font-size: 18px; fill: #5b6474; }
      .band-title { font-size: 20px; font-weight: 750; letter-spacing: 1.2px; }
      .node-title { font-size: 22px; font-weight: 740; text-anchor: middle; }
      .node-sub { font-size: 16px; fill: #475569; text-anchor: middle; }
      .small { font-size: 15px; fill: #475569; text-anchor: middle; }
      .chip { font-size: 16px; font-weight: 650; text-anchor: middle; }
      .legend { font-size: 17px; }
      .label { font-size: 16px; font-weight: 650; }
      .box { fill: #ffffff; stroke-width: 2.5; rx: 12; }
      .blue-box { stroke: #2563eb; }
      .violet-box { stroke: #7c3aed; }
      .teal-box { stroke: #0f766e; }
      .amber-box { stroke: #d97706; }
      .red-box { stroke: #dc2626; }
      .blue-line, .violet-line, .teal-line, .amber-line, .red-line, .gray-line { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .blue-line { stroke: #2563eb; marker-end: url(#arrow-blue); }
      .violet-line { stroke: #7c3aed; marker-end: url(#arrow-violet); }
      .teal-line { stroke: #0f766e; marker-end: url(#arrow-teal); }
      .amber-line { stroke: #d97706; marker-end: url(#arrow-amber); }
      .red-line { stroke: #dc2626; marker-end: url(#arrow-red); }
      .gray-line { stroke: #94a3b8; }
      .dotted { stroke-dasharray: 7 8; }
    </style>
  </defs>

