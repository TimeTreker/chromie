# RTX 4090 Laptop maintained inference runtime selected by its hardware profile.
# Keep the base chromie-llm service identity so Agent dependencies and diagnostics
# do not change when the serving backend changes from Ollama to SGLang.
services:
  chromie-llm:
    image: chromie-sglang:qwen35-4b-awq
    build:
      context: ./llm/sglang
      dockerfile: Dockerfile
    ipc: host
    entrypoint: [python3, -m, sglang.launch_server]
    command:
      - --model-path
      - cyankiwi/Qwen3.5-4B-AWQ-4bit
      - --revision
      - ef85d23bebaba87b3c4672ba11c449c79dbdb23e
      - --served-model-name
      - ${AGENT_MODEL:?AGENT_MODEL must be generated}
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --trust-remote-code
      - --dtype
      - bfloat16
      - --context-length
      - "49152"
      - --max-total-tokens
      - "49152"
      - --max-running-requests
      - "2"
      - --max-mamba-cache-size
      - "10"
      - --mem-fraction-static
      - "0.80"
      - --chunked-prefill-size
      - "2048"
      - --schedule-conservativeness
      - "1.0"
      - --cuda-graph-backend-prefill
      - breakable
      - --schedule-policy
      - fcfs
      - --enable-priority-scheduling
      - --default-priority-value
      - "0"
      - --abort-on-priority-when-disabled
      - --priority-scheduling-preemption-threshold
      - "10"
      - --enable-metrics
      - --enable-request-time-stats-logging
    ports: !override
      - "127.0.0.1:30000:30000"
    volumes: !override
      - /etc/localtime:/etc/localtime:ro
      - ./hf_cache:/root/.cache/huggingface
      - ./.chromie/sglang-kernel-cache:/root/.cache/flashinfer
    environment: !override
      CHROMIE_ACTIVE_PROFILE: ${CHROMIE_ACTIVE_PROFILE:?CHROMIE_ACTIVE_PROFILE must be generated}
      CHROMIE_RUNTIME_ENV_FINGERPRINT: ${CHROMIE_RUNTIME_ENV_FINGERPRINT:?CHROMIE_RUNTIME_ENV_FINGERPRINT must be generated}
      TZ: ${CHROMIE_HOST_TIMEZONE:?CHROMIE_HOST_TIMEZONE must be detected}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-0}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,chromie-agent,chromie-tts,host.docker.internal}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,chromie-agent,chromie-tts,host.docker.internal}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:30000/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s
